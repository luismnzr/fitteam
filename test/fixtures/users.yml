# Los emails deben ser únicos (índice único sobre email).
admin:
  email: admin@example.com
  name: Ana Gaby
  admin: true
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>

member:
  email: member@example.com
  name: Member Activa
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  subscription_ends_at: <%= 20.days.from_now.utc.to_fs(:db) %>
