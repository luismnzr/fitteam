      updated: "Tu cuenta se actualizó."
      updated_but_not_signed_in: "Tu cuenta se actualizó. Como cambiaste tu contraseña, inicia sesión de nuevo."
    sessions:
      signed_in: "Iniciaste sesión."
      signed_out: "Cerraste sesión."
      already_signed_out: "Cerraste sesión."
    unlocks:
      send_instructions: "En unos minutos te llegará un correo con instrucciones para desbloquear tu cuenta."
      send_paranoid_instructions: "Si tu cuenta existe, en unos minutos te llegará un correo con instrucciones para desbloquearla."
      unlocked: "Tu cuenta se desbloqueó. Inicia sesión para continuar."
  errors:
    messages:
      already_confirmed: "ya estaba confirmado, intenta iniciar sesión"
      confirmation_period_expired: "debe confirmarse en %{period}, solicita uno nuevo"
      expired: "ya expiró, solicita uno nuevo"
      not_found: "no se encontró"
      not_locked: "no estaba bloqueada"
      not_saved:
        one: "Revisa lo siguiente:"
        other: "Revisa lo siguiente:"

  # Formularios de login, registro y "Mi cuenta".
  activerecord:
    attributes:
      user:
        name: "Nombre"
        email: "Correo electrónico"
        password: "Contraseña"
        password_confirmation: "Confirmación de contraseña"
        current_password: "Contraseña actual"
        reset_password_token: "El enlace para restablecer la contraseña"
    errors:
      models:
        user:
          blank: "no puede estar en blanco"
          taken: "ya está registrado"
          invalid: "no es válido"
          too_short: "debe tener al menos %{count} caracteres"
          too_long: "debe tener como máximo %{count} caracteres"
          confirmation: "no coincide con la contraseña"
