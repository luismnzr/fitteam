      send_paranoid_instructions: "Si tu correo está registrado, en unos minutos te llegará un enlace para restablecer tu contraseña."
      updated: "Tu contraseña se cambió y ya iniciaste sesión."
      updated_not_active: "Tu contraseña se cambió."
    registrations:
      destroyed: "Tu cuenta se canceló. ¡Esperamos verte pronto!"
      signed_up: "¡Te damos la bienvenida a Fitteam! Tu cuenta quedó creada."
      signed_up_but_inactive: "Tu cuenta quedó creada, pero todavía no está activa, así que no pudimos iniciar tu sesión."
